name: temp-npm-audit

on:
  push:
    branches: [security/next-lts-upgrade]

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/next-lts-upgrade
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: NPM audit details
        run: npm audit --audit-level=moderate || true
