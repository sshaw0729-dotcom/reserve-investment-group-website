name: generate-lockfile
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm install --package-lock-only
      - run: git config user.name "github-actions[bot]" && git config user.email "github-actions[bot]@users.noreply.github.com" && git add package-lock.json && (git diff --cached --quiet || git commit -m "Generate package-lock.json") && git push
